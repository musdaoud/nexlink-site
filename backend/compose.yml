# Development: Django (auto-reload) + PostgreSQL + Mailpit (catches every email → http://localhost:8025)
name: hyperlink-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperlink}
      POSTGRES_USER: ${POSTGRES_USER:-hyperlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperlink-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web inbox

  web:
    build: .
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${WEB_PORT:-8010}:8000"   # http://localhost:8010
    volumes:
      - .:/app
      - private_media:/data/private_media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  private_media:
